name: Finance V2 Gate 3 CI

on:
  push:
    branches:
      - agent/finance-v2-gate3-preview
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  NEXT_PUBLIC_SUPABASE_URL: https://zhihbyarqpkudqyomcxv.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tadZy_NLwwIRA0RRES1ykg_mETtBwTa

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Gate 3 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Finance V2 rule tests
        run: npm run test:finance-v2

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint changed Gate 3 source files
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' | grep -v '^.github/' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed source files to lint."
            exit 0
          fi
          printf 'Linting changed files:\n%s\n' "${files[*]}"
          npx eslint "${files[@]}"

      - name: Full repository ESLint diagnostic
        continue-on-error: true
        run: npm run lint

      - name: Next.js production build
        run: npm run build
