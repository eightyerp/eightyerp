name: Android Window Check APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/window-check-android-mvp
      - feature/window-check-ai-backend-v1
    paths:
      - "mobile/window-check-android/**"
      - ".github/workflows/android-window-check-apk.yml"

concurrency:
  group: android-window-check-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Enable KVM acceleration
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: mobile/window-check-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature and manifest
        working-directory: mobile/window-check-android
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee apk-signature.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          grep -F "package: name='com.eighty.windowcheck.preview.internal'" apk-badging.txt
          grep -F "targetSdkVersion:'36'" apk-badging.txt

      - name: Run unit tests
        working-directory: mobile/window-check-android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Install and launch on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r mobile/window-check-android/app/build/outputs/apk/debug/app-debug.apk | tee adb-install.txt
            grep -F "Success" adb-install.txt
            adb shell pm path com.eighty.windowcheck.preview.internal | tee installed-path.txt
            grep -F "package:" installed-path.txt
            adb logcat -c
            adb shell monkey -p com.eighty.windowcheck.preview.internal -c android.intent.category.LAUNCHER 1 | tee launch-smoke.txt
            sleep 5
            adb shell pidof com.eighty.windowcheck.preview.internal | tee app-pid.txt
            test -s app-pid.txt
            adb logcat -d -t 700 > launch-logcat.txt
            ! grep -E "FATAL EXCEPTION|Process: com.eighty.windowcheck.preview.internal" launch-logcat.txt

      - name: Upload APK only after Android 16 install and launch pass
        uses: actions/upload-artifact@v4
        with:
          name: eighty-window-check-install-verified-apk
          path: mobile/window-check-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
