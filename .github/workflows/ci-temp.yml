name: ERP Temp CI

on:
  push:
    branches:
      - "codex/react19-lint-stability-20260816"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/react19-lint-stability-20260816
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded warning cleanup
        run: |
          node scripts/apply-warning-cleanup.mjs
          if ! git diff --quiet; then
            git config user.name "eightyerp-ci"
            git config user.email "actions@users.noreply.github.com"
            git add components/auth/CompanyRegistrationForm.tsx components/auth/SignupForm.tsx components/quotes/QuoteWizardForm.tsx components/schedules/CustomerSchedulesWorkspace.tsx
            git commit -m "chore: clear remaining Next and React lint warnings"
            git push origin HEAD:codex/react19-lint-stability-20260816
          fi
      - run: npm ci
      - name: Strict lint
        run: npm run lint -- --max-warnings=0
      - name: Build
        run: npm run build
