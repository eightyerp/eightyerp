name: ERP Window Flow Visual QA

on:
  push:
    branches:
      - feat/precontract-site-contract-transition-v2
    paths:
      - "app/qa-window-flow/page.tsx"
      - "components/customers/CreateSiteButton.tsx"
      - "components/quotes/ContractTransitionPanel.tsx"
      - "lib/crm/project-constants.ts"
      - "proxy.ts"
      - ".github/workflows/erp-window-flow-visual-qa.yml"

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ERP
        run: npm ci
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start ERP QA server
        env:
          ERP_WINDOW_FLOW_QA: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://qa-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_qa_placeholder
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/erp-window-qa.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:3000/qa-window-flow" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/erp-window-qa.log
          exit 1
      - name: Capture ERP window workflow UI
        run: |
          mkdir -p visual-qa
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1366, height: 768 } });
          await page.goto('http://127.0.0.1:3000/qa-window-flow', { waitUntil: 'networkidle' });
          await page.screenshot({ path: 'visual-qa/window-flow-1366.png', fullPage: true });
          await page.getByRole('button', { name: '점검·상담 현장 만들기' }).click();
          await page.screenshot({ path: 'visual-qa/precontract-site-modal-1366.png', fullPage: true });
          const small = await browser.newPage({ viewport: { width: 1024, height: 768 } });
          await small.goto('http://127.0.0.1:3000/qa-window-flow', { waitUntil: 'networkidle' });
          await small.screenshot({ path: 'visual-qa/window-flow-1024.png', fullPage: true });
          await browser.close();
          EOF
      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-window-flow-visual-qa
          path: visual-qa/*.png
          retention-days: 3
