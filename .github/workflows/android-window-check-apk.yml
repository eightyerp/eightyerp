name: Android Window Check APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/window-check-android-mvp
    paths:
      - "mobile/window-check-android/**"
      - ".github/workflows/android-window-check-apk.yml"
  pull_request:
    paths:
      - "mobile/window-check-android/**"
      - ".github/workflows/android-window-check-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: mobile/window-check-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Run unit tests
        working-directory: mobile/window-check-android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eighty-window-check-internal-apk
          path: mobile/window-check-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
