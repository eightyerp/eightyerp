name: ERP CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: erp-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Window workflow lifecycle guard
        run: node scripts/test-window-workflow-lifecycle.mjs

      - name: CRM mobile contract guard
        run: node scripts/test-crm-mobile-contract.mjs

      - name: CRM mobile layout guard
        run: node scripts/test-crm-mobile-layout.mjs

      - name: CRM Android iPhone install guard
        run: node scripts/test-crm-platform-install.mjs

      - name: CRM home performance guard
        run: node scripts/test-crm-home-performance.mjs

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
