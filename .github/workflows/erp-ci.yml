name: ERP CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Window workflow lifecycle guard
        run: node scripts/test-window-workflow-lifecycle.mjs

      - name: Window Check operational storage guard
        run: node scripts/test-window-check-operational-storage.mjs

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  local-db-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize local Supabase config
        run: supabase init --force

      - name: Apply all migrations to local Supabase Postgres
        run: supabase db start

      - name: Lint local database functions
        run: supabase db lint --local --level error --fail-on error

      - name: Stop local Supabase database
        if: always()
        run: supabase stop --no-backup || true
