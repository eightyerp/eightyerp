name: Android Window Check APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/window-check-android-mvp
      - feature/window-check-ai-backend-v1
    paths:
      - "mobile/window-check-android/**"
      - ".github/workflows/android-window-check-apk.yml"

concurrency:
  group: android-window-check-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: mobile/window-check-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature
        working-directory: mobile/window-check-android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" apk-signature.txt

      - name: Run unit tests
        working-directory: mobile/window-check-android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Create Android 16 emulator
        run: |
          echo no | avdmanager create avd \
            --force \
            --name eightyApi36 \
            --package "system-images;android-36;google_apis;x86_64" \
            --device "pixel_6"

      - name: Boot emulator
        run: |
          nohup emulator \
            -avd eightyApi36 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            > "$RUNNER_TEMP/eighty-emulator.log" 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/eighty-emulator.log" || true
          exit 1

      - name: Real install smoke on Android 16
        working-directory: mobile/window-check-android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          PACKAGE="com.eighty.windowcheck.preview.internal"
          adb install -r "$APK" | tee adb-install.txt
          grep -F "Success" adb-install.txt
          adb shell pm path "$PACKAGE" | tee installed-path.txt
          grep -F "package:" installed-path.txt

      - name: Launch app smoke
        run: |
          PACKAGE="com.eighty.windowcheck.preview.internal"
          adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 | tee launch-smoke.txt
          sleep 3
          adb shell pidof "$PACKAGE" | tee app-pid.txt
          test -s app-pid.txt
          if adb logcat -d -t 500 | grep -E "FATAL EXCEPTION|Process: $PACKAGE"; then
            echo "App crash detected after launch"
            exit 1
          fi

      - name: Upload APK only after install smoke passes
        uses: actions/upload-artifact@v4
        with:
          name: eighty-window-check-install-verified-apk
          path: mobile/window-check-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
