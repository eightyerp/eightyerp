name: CRM Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/crm-mobile-pwa-push-foundation
    paths:
      - "mobile/crm-android-twa/**"
      - ".github/workflows/crm-android-apk.yml"

concurrency:
  group: crm-android-apk-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android verification tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Prepare signing key
        working-directory: mobile/crm-android-twa
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ secrets.CRM_ANDROID_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.CRM_ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android.keystore
            echo "CRM_KEYSTORE_PASSWORD=${{ secrets.CRM_ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "CRM_KEY_ALIAS=${{ secrets.CRM_ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "CRM_KEY_PASSWORD=${{ secrets.CRM_ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "CRM_ANDROID_SIGNING_MODE=crm-stable-secret" >> "$GITHUB_ENV"
            echo "CRM_ANDROID_SIGNING_STABLE=true" >> "$GITHUB_ENV"
          elif [ -n "${{ secrets.WINDOW_CHECK_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.WINDOW_CHECK_KEYSTORE_BASE64 }}" | base64 --decode > android.keystore
            echo "CRM_KEYSTORE_PASSWORD=${{ secrets.WINDOW_CHECK_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "CRM_KEY_ALIAS=${{ secrets.WINDOW_CHECK_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "CRM_KEY_PASSWORD=${{ secrets.WINDOW_CHECK_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "CRM_ANDROID_SIGNING_MODE=shared-internal-secret" >> "$GITHUB_ENV"
            echo "CRM_ANDROID_SIGNING_STABLE=true" >> "$GITHUB_ENV"
          else
            # 직원 1차 설치 테스트용. 이 키는 매 CI마다 달라지므로 업데이트 배포용으로 쓰지 않는다.
            keytool -genkeypair \
              -keystore android.keystore \
              -storepass eighty-crm-test-only \
              -keypass eighty-crm-test-only \
              -alias eightycrmtest \
              -keyalg RSA \
              -keysize 2048 \
              -validity 30 \
              -dname "CN=EIGHTY CRM Test, OU=Internal QA, O=EIGHTY, L=Seoul, C=KR"
            echo "CRM_KEYSTORE_PASSWORD=eighty-crm-test-only" >> "$GITHUB_ENV"
            echo "CRM_KEY_ALIAS=eightycrmtest" >> "$GITHUB_ENV"
            echo "CRM_KEY_PASSWORD=eighty-crm-test-only" >> "$GITHUB_ENV"
            echo "CRM_ANDROID_SIGNING_MODE=ephemeral-test-key" >> "$GITHUB_ENV"
            echo "CRM_ANDROID_SIGNING_STABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Stamp APK version
        working-directory: mobile/crm-android-twa
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'twa-manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const run = Number(process.env.GITHUB_RUN_NUMBER || '1');
          manifest.appVersionCode = 200000 + run;
          manifest.appVersion = `0.1.0-test.${run}`;
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(`APK version ${manifest.appVersion} (${manifest.appVersionCode})`);
          NODE

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          bubblewrap updateConfig \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="$ANDROID_HOME"
          bubblewrap doctor

      - name: Generate Android TWA project
        working-directory: mobile/crm-android-twa
        run: bubblewrap update --skipVersionUpgrade --manifest="$PWD"

      - name: Build signed APK
        working-directory: mobile/crm-android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.CRM_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.CRM_KEY_PASSWORD }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --manifest="$PWD" \
            --signingKeyPath="$PWD/android.keystore" \
            --signingKeyAlias="$CRM_KEY_ALIAS"

      - name: Verify APK package and signature
        working-directory: mobile/crm-android-twa
        run: |
          set -euo pipefail
          APK="$PWD/app-release-signed.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.eighty.crm.internal'" apk-badging.txt
          grep -F "application-label:'EIGHTY CRM'" apk-badging.txt

      - name: Prepare downloadable artifact
        working-directory: mobile/crm-android-twa
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app-release-signed.apk "artifacts/EIGHTY-CRM-Android-test-${GITHUB_RUN_NUMBER}.apk"
          cp apk-signature.txt artifacts/
          cp apk-badging.txt artifacts/
          if [ -f assetlinks.json ]; then
            cp assetlinks.json artifacts/
          fi

          {
            echo "EIGHTY CRM Android test APK"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "commit=${GITHUB_SHA}"
            echo "package=com.eighty.crm.internal"
            echo "target=https://eightyerp.vercel.app/crm"
            echo "signing_mode=${CRM_ANDROID_SIGNING_MODE}"
            echo "stable_signing=${CRM_ANDROID_SIGNING_STABLE}"
            if [ "$CRM_ANDROID_SIGNING_STABLE" != "true" ]; then
              echo "warning=TEST ONLY. A later stable-key APK may require uninstalling this test package before install."
              echo "assetlinks=DO NOT DEPLOY assetlinks.json generated from an ephemeral key."
            else
              echo "assetlinks=Candidate for production Digital Asset Links after fingerprint verification."
            fi
          } > artifacts/BUILD-INFO.txt

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: eighty-crm-android-test-apk
          path: mobile/crm-android-twa/artifacts/
          if-no-files-found: error
          retention-days: 14
