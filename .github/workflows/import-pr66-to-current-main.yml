name: Import PR66 onto current main

on:
  push:
    branches:
      - feat/precontract-site-contract-transition-v2

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current-main integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/precontract-site-contract-transition-v2
          fetch-depth: 0
      - name: Fetch original PR66 branch
        run: git fetch origin feat/precontract-site-contract-transition
      - name: Import final PR66 product files only
        run: |
          git checkout origin/feat/precontract-site-contract-transition -- \
            '.github/workflows/erp-ci.yml' \
            'app/actions/quote-contract-transition.ts' \
            'app/actions/quote-mgmt.ts' \
            'app/quotes/[id]/page.tsx' \
            'components/customers/CreateSiteButton.tsx' \
            'components/customers/CustomerSitesPanel.tsx' \
            'components/quotes/ContractTransitionPanel.tsx' \
            'docs/WINDOW_WORKFLOW_LIFECYCLE.md' \
            'lib/crm/project-constants.ts' \
            'lib/crm/projects.ts' \
            'lib/crm/quote-contract-transition.ts' \
            'scripts/test-window-workflow-lifecycle.mjs'
      - name: Commit integration snapshot
        run: |
          if git diff --quiet --cached && git diff --quiet; then
            echo "No import changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: rebase window workflow lifecycle onto current main"
          git push origin HEAD:feat/precontract-site-contract-transition-v2
