name: ERP CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Window workflow lifecycle guard
        run: node scripts/test-window-workflow-lifecycle.mjs

      - name: Window Check operational storage guard
        run: node scripts/test-window-check-operational-storage.mjs

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  window-check-local-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Preserve historical migrations outside local replay
        run: |
          mv supabase/migrations /tmp/eighty-erp-full-migrations
          mkdir -p supabase/migrations

      - name: Initialize clean local Supabase
        run: |
          supabase init --force
          supabase db start

      - name: Apply current ERP dependency fixture
        run: |
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          cat scripts/fixtures/window-check-operational-current-schema.sql |
            docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres

      - name: Execute Window Check operational migration
        run: |
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          cat /tmp/eighty-erp-full-migrations/20260818030000_window_check_operational_storage_v1.sql |
            docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres

      - name: Verify resulting schema and policies
        run: |
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          cat > /tmp/window-check-schema-verification.sql <<'SQL'
          select count(*) = 3
          from information_schema.tables
          where table_schema = 'public'
            and table_name in (
              'window_inspection_snapshots',
              'window_inspection_photos',
              'window_inspection_reports'
            );

          select count(*) = 5
          from pg_proc p
          join pg_namespace n on n.oid = p.pronamespace
          where n.nspname = 'erp_private'
            and p.proname in (
              'can_access_window_inspection',
              'can_write_window_inspection',
              'validate_window_inspection_child_company',
              'validate_window_inspection_report_snapshot',
              'window_storage_path_uuid'
            );

          select count(*) = 2
          from storage.buckets
          where id in ('window-inspection-private', 'window-report-private')
            and public = false;

          select count(*) = 0
          from pg_proc p
          join pg_namespace n on n.oid = p.pronamespace
          where n.nspname = 'public'
            and p.proname in (
              'can_access_window_inspection',
              'can_write_window_inspection',
              'validate_window_inspection_child_company',
              'validate_window_inspection_report_snapshot',
              'window_storage_path_uuid'
            );
          SQL
          cat /tmp/window-check-schema-verification.sql |
            docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -At |
            tee /tmp/window-check-schema-verification.txt
          test "$(grep -c '^t$' /tmp/window-check-schema-verification.txt)" -eq 4

      - name: Seed deidentified RLS actors
        run: |
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          cat scripts/fixtures/window-check-operational-rls-seed.sql |
            docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres

      - name: Verify Window Check read and insert RLS
        run: |
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          INSPECTOR_USER='10000000-0000-4000-8000-000000000001'
          OTHER_USER='10000000-0000-4000-8000-000000000002'
          ADMIN_USER='10000000-0000-4000-8000-000000000003'

          query_as() {
            local user_id="$1"
            local sql="$2"
            docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atq <<SQL
          begin;
          set local "request.jwt.claim.sub" = '$user_id';
          set local role authenticated;
          $sql
          rollback;
          SQL
          }

          INSPECTION_ID='70000000-0000-4000-8000-000000000001'
          test "$(query_as "$INSPECTOR_USER" "select count(*) from public.window_inspections where id='$INSPECTION_ID';")" = '1'
          test "$(query_as "$OTHER_USER" "select count(*) from public.window_inspections where id='$INSPECTION_ID';")" = '0'
          test "$(query_as "$ADMIN_USER" "select count(*) from public.window_inspections where id='$INSPECTION_ID';")" = '1'

          inspector_insert="insert into public.window_inspection_snapshots (
            inspection_id, company_id, snapshot_version, schema_version, payload_json,
            payload_sha256, approval_input_sha256, approved_by_user_id,
            approved_by_employee_id, approved_at
          ) values (
            '$INSPECTION_ID', '20000000-0000-4000-8000-000000000001', 1,
            'window-check-approved-v1', '{\"serverPayloadSchemaVersion\":\"window-check-approved-v1\"}'::jsonb,
            'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
            'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb',
            '$INSPECTOR_USER', '30000000-0000-4000-8000-000000000001', now()
          );"
          query_as "$INSPECTOR_USER" "$inspector_insert"

          other_insert="insert into public.window_inspection_snapshots (
            inspection_id, company_id, snapshot_version, schema_version, payload_json,
            payload_sha256, approval_input_sha256, approved_by_user_id,
            approved_by_employee_id, approved_at
          ) values (
            '$INSPECTION_ID', '20000000-0000-4000-8000-000000000001', 1,
            'window-check-approved-v1', '{\"serverPayloadSchemaVersion\":\"window-check-approved-v1\"}'::jsonb,
            'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
            'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb',
            '$OTHER_USER', '30000000-0000-4000-8000-000000000002', now()
          );"
          if query_as "$OTHER_USER" "$other_insert" >/tmp/other-insert.out 2>/tmp/other-insert.err; then
            echo 'Other employee unexpectedly inserted inspector snapshot'
            exit 1
          fi
          grep -Eqi 'row-level security|permission denied' /tmp/other-insert.err

          admin_insert="insert into public.window_inspection_snapshots (
            inspection_id, company_id, snapshot_version, schema_version, payload_json,
            payload_sha256, approval_input_sha256, approved_by_user_id,
            approved_by_employee_id, approved_at
          ) values (
            '$INSPECTION_ID', '20000000-0000-4000-8000-000000000001', 1,
            'window-check-approved-v1', '{\"serverPayloadSchemaVersion\":\"window-check-approved-v1\"}'::jsonb,
            'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
            'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb',
            '$ADMIN_USER', '30000000-0000-4000-8000-000000000003', now()
          );"
          if query_as "$ADMIN_USER" "$admin_insert" >/tmp/admin-insert.out 2>/tmp/admin-insert.err; then
            echo 'Admin unexpectedly inserted another employee inspection snapshot through client RLS'
            exit 1
          fi
          grep -Eqi 'row-level security|permission denied' /tmp/admin-insert.err

      - name: Lint local database functions
        run: supabase db lint --local --level error --fail-on error

      - name: Stop local Supabase database
        if: always()
        run: supabase stop --no-backup || true
